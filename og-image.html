<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiledly OG Image</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
            font-family: system-ui, -apple-system, sans-serif;
            color: #ffffff;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        .grid-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 80px 100px;
        }
        .left-icon {
            font-size: 200px;
            margin-right: 80px;
            filter: drop-shadow(0 0 40px rgba(0, 229, 255, 0.3));
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 {
            font-size: 110px;
            font-weight: 800;
            margin: 0;
            line-height: 1.1;
            letter-spacing: -2px;
        }
        .subtitle {
            font-size: 42px;
            font-weight: 600;
            color: #00e5ff;
            margin: 10px 0 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .tagline {
            font-size: 32px;
            color: #a0a0b8;
            margin: 0 0 60px;
            line-height: 1.4;
            max-width: 800px;
        }
        .modes {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .mode-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .mode-emoji {
            font-size: 36px;
            margin-bottom: 8px;
        }
        .mode-label {
            font-size: 14px;
            color: #8a8a9e;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .bottom-url {
            position: absolute;
            bottom: 60px;
            right: 100px;
            font-size: 28px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="container">
        <div class="left-icon">⚡</div>
        <div class="content">
            <h1>Tiledly</h1>
            <div class="subtitle">Daily Speed Challenge</div>
            <div class="tagline">One daily challenge. Tap as fast as you can. Race against the world.</div>
            
            <div class="modes">
                <div class="mode-item"><span class="mode-emoji">⚡</span><span class="mode-label">Speed</span></div>
                <div class="mode-item"><span class="mode-emoji">🔢</span><span class="mode-label">Order</span></div>
                <div class="mode-item"><span class="mode-emoji">🎨</span><span class="mode-label">Colors</span></div>
                <div class="mode-item"><span class="mode-emoji">🧠</span><span class="mode-label">Memory</span></div>
                <div class="mode-item"><span class="mode-emoji">💣</span><span class="mode-label">Mines</span></div>
                <div class="mode-item"><span class="mode-emoji">🧮</span><span class="mode-label">Math</span></div>
                <div class="mode-item"><span class="mode-emoji">🔤</span><span class="mode-label">Words</span></div>
            </div>
        </div>
        <div class="bottom-url">tiledly.com</div>
    </div>
</body>
</html>
